server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Health endpoints belong to the API, not the SPA fallback
  location = /healthz {
    proxy_pass http://api:3000;
  }
  location = /readyz {
    proxy_pass http://api:3000;
  }

  # OAuth discovery for MCP clients (RFC 8414/9728) is served by the API
  location /.well-known/ {
    proxy_pass http://api:3000;
  }

  # Proxy API to the api service
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    # SSE
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }
}
