# Honour an outer proxy's X-Forwarded-Proto (TLS is usually terminated above
# this container, so $scheme alone would say "http" on an https site). The API
# builds its OAuth discovery URLs from these headers, and an MCP client cannot
# register if they point anywhere but the public address.
map $http_x_forwarded_proto $fwd_proto {
  default $scheme;
  "~."    $http_x_forwarded_proto;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Health endpoints belong to the API, not the SPA fallback
  location = /healthz {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
  }
  location = /readyz {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
  }

  # OAuth discovery for MCP clients (RFC 8414/9728) is served by the API.
  # Host and proto must be passed through: the API answers with absolute URLs,
  # and without these nginx would send Host: api:3000 and the client would be
  # told to register against an address that only exists inside Docker.
  location /.well-known/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Proxy API to the api service
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    # SSE
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }
}
