name: Release

# release-please keeps a "chore: release X.Y.Z" PR open on master. It bumps
# the version in every file that carries it and adds the CHANGELOG section,
# both built from the conventional titles of the PRs squash-merged since the
# last release (see CLAUDE.md, "PR titles").
#
# Merging that PR makes the next run tag vX.Y.Z and create a DRAFT GitHub
# release whose body is that CHANGELOG section, then dispatch the desktop
# and image builds. The desktop workflow publishes the release once every
# platform's bundle is uploaded – publishing here would flip
# `releases/latest` (and the desktop updater's latest.json URL) to a version
# whose binaries do not exist yet. `force-tag-creation` matters because
# GitHub creates no tag for a draft, and without the tag release-please
# cannot find the previous release. The explicit dispatches matter because
# tags and PRs created with GITHUB_TOKEN fire no other workflow.
on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Name the release like the earlier ones
        if: steps.release.outputs.release_created
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh release edit "$TAG" --repo "${{ github.repository }}" --title "ordi $TAG"
      - name: Dispatch desktop builds for the tag
        if: steps.release.outputs.release_created
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run desktop.yml --repo "${{ github.repository }}" --ref "${{ steps.release.outputs.tag_name }}"
      # The server image does not wait for the desktop bundles: a self-hoster
      # pulling the release should not depend on three platform builds.
      - name: Dispatch the image build for the tag
        if: steps.release.outputs.release_created
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run image.yml --repo "${{ github.repository }}" --ref "${{ steps.release.outputs.tag_name }}"
