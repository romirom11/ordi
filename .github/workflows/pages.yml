name: Pages

# Publishes the landing page (site/) to GitHub Pages. The site is plain HTML
# and CSS – the build step only collects the screenshots out of docs/images,
# so this needs no pnpm install and no lockfile.
#
# One-time setup in the repository: Settings -> Pages -> Source: GitHub Actions.
on:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - 'docs/images/**'
      - 'mcp-consent.png'
      - 'scripts/build-site.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A queued run should publish the newest master, not fight the one in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the site
        run: node scripts/build-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
      - id: deployment
        uses: actions/deploy-pages@v4
