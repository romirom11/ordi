# Production stack, meant for a PaaS that puts its own router in front
# (Dokploy/Traefik, Coolify, plain docker compose behind nginx or Caddy).
#
# One service is the whole application: `api` serves the SPA, the REST API,
# SSE and the OAuth discovery paths MCP clients need. Point the router at the
# `api` service, port 3000, path `/` - and add no other routing rule.
#
# Everything is configured through env vars; nothing is published to the host,
# because the router reaches the containers over the compose network.
#
# Required: POSTGRES_PASSWORD, AUTH_SECRET, ENCRYPTION_KEY, APP_URL.
# APP_URL must be the public https address, e.g. https://ordi.example.com – it
# is what emails, PDF links and the OAuth discovery documents are built from.

services:
  # Generic service names are a trap on a PaaS: the router attaches `api` to a
  # shared network (Dokploy/Coolify), and a container on two networks resolves
  # names against BOTH - so `db` or `minio` can land on another project's
  # container. Every in-stack address therefore uses a unique alias
  # (ordi-db, ordi-minio) that exists only on this stack's own network.
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      default:
        aliases: [ordi-db]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ordi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ordi}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ordi}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Bundled object storage for installs without external S3/R2.
  # Off by default: enable with COMPOSE_PROFILES=minio in the environment,
  # plus S3_ENDPOINT=http://ordi-minio:9000. Root credentials are the same pair
  # the api uses, so the two can never drift apart. Nothing is published to
  # the host: all file traffic goes through the api.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    profiles: ["minio"]
    command: server /data
    networks:
      default:
        aliases: [ordi-minio]
    environment:
      # Interpolation runs even for profile-disabled services, so these cannot
      # be `:?`-required; MinIO itself refuses to start on empty credentials.
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Creates the bucket on first boot, so "make a bucket in the console" stops
  # being a manual step (the console is not even exposed).
  minio-init:
    image: minio/mc:latest
    profiles: ["minio"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://ordi-minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${BUCKET}
      "
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-}
      BUCKET: ${S3_BUCKET:-ordi}

  # The whole application: REST API, workers, and the built web app.
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      # Migrations run on boot (see the image's CMD), so a fresh volume and an
      # upgraded image both end up at the right schema without extra steps.
      DATABASE_URL: postgres://${POSTGRES_USER:-ordi}:${POSTGRES_PASSWORD}@ordi-db:5432/${POSTGRES_DB:-ordi}
      APP_URL: ${APP_URL:?set APP_URL to the public https address}
      # Same origin as the SPA: the API lives under /api/v1 on it, and every
      # callback URL is built by appending that path – so no /api suffix here.
      API_URL: ${API_URL:-${APP_URL}}
      CORS_ORIGINS: ${CORS_ORIGINS:-${APP_URL}}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY (32-byte hex)}
      SMTP_URL: ${SMTP_URL:-}
      SMTP_FROM: ${SMTP_FROM:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-ordi}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-auto}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      # AI agent employees: the run worker lives in this container unless you
      # split it out (see agent-worker below). Set AGENT_WORKER_ENABLED=0 to
      # run the platform with agents configurable but no runs executing here.
      AGENT_WORKER_ENABLED: ${AGENT_WORKER_ENABLED:-1}
      AGENT_WORKER_CONCURRENCY: ${AGENT_WORKER_CONCURRENCY:-2}
      # Claude is connected in Settings → Agents (a `claude setup-token`
      # subscription token or an API key). This env var is only a fallback
      # source for API keys, for a PaaS that configures everything by env.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      # tasks/<taskId>/checkout: one fresh clone per run, deleted when it
      # ends – size for AGENT_WORKER_CONCURRENCY × repository size; and
      # tasks/<taskId>/harness: session transcripts kept 30 days so follow-ups
      # resume. Every container that claims runs must mount the same volume
      # (docs/operations.md).
      - agent_work:/data/agent-work
    depends_on:
      db:
        condition: service_healthy

  # ── Optional: run agents in their own container ──
  #
  # An agent run is the only thing in ordi that executes model-authored code.
  # It is already sandboxed (rebuilt child env, per-run token, allow/deny tool
  # lists – see docs/architecture-decisions.md §12), but its blast radius is
  # still the container it runs in. Moving it out of the container that serves
  # requests means a runaway run cannot take the site down with it, and the
  # runs get their own CPU/memory limits.
  #
  # To enable: uncomment the block below and set `AGENT_WORKER_ENABLED=0` in
  # the environment, so the `api` service stops claiming runs itself. Both
  # services need the same DATABASE_URL, ENCRYPTION_KEY (credentials and
  # connector secrets are encrypted with it) and APP_URL, and both mount
  # agent_work. Runs are claimed with SKIP LOCKED, so nothing is executed
  # twice even if you get the flags wrong for a moment.
  #
  # It runs the same server process, only with no published port: the worker
  # talks to ordi over its own loopback (the per-run MCP token points at
  # http://localhost:3000/api/v1), and the connector gateway lives there too.
  # Migrations stay with `api` – one container writes the schema, not two.
  #
  # agent-worker:
  #   build:
  #     context: .
  #     dockerfile: docker/Dockerfile.api
  #   restart: unless-stopped
  #   command: ["sh", "-c", "pnpm --filter @ordi/api exec tsx src/server.ts"]
  #   environment:
  #     NODE_ENV: production
  #     DATABASE_URL: postgres://${POSTGRES_USER:-ordi}:${POSTGRES_PASSWORD}@ordi-db:5432/${POSTGRES_DB:-ordi}
  #     APP_URL: ${APP_URL}
  #     API_URL: ${API_URL:-${APP_URL}}
  #     AUTH_SECRET: ${AUTH_SECRET}
  #     ENCRYPTION_KEY: ${ENCRYPTION_KEY}
  #     ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  #     AGENT_WORKER_ENABLED: "1"
  #     AGENT_WORKER_CONCURRENCY: ${AGENT_WORKER_CONCURRENCY:-2}
  #   volumes:
  #     - agent_work:/data/agent-work
  #   depends_on:
  #     db:
  #       condition: service_healthy

volumes:
  db_data:
  minio_data:
  agent_work:
