# Production stack, meant for a PaaS that puts its own router in front
# (Dokploy/Traefik, Coolify, plain docker compose behind nginx or Caddy).
#
# One service is the whole application: `api` serves the SPA, the REST API,
# SSE and the OAuth discovery paths MCP clients need. Point the router at the
# `api` service, port 3000, path `/` - and add no other routing rule.
#
# Everything is configured through env vars; nothing is published to the host,
# because the router reaches the containers over the compose network.
#
# Required: POSTGRES_PASSWORD, AUTH_SECRET, ENCRYPTION_KEY, APP_URL,
# AGENT_WORKER_SECRET.
# APP_URL must be the public https address, e.g. https://ordi.example.com – it
# is what emails, PDF links and the OAuth discovery documents are built from.
# AGENT_WORKER_SECRET is what the agent-worker container presents to the api;
# any random string (openssl rand -hex 32).

services:
  # Generic service names are a trap on a PaaS: the router attaches `api` to a
  # shared network (Dokploy/Coolify), and a container on two networks resolves
  # names against BOTH - so `db` or `minio` can land on another project's
  # container. Every in-stack address therefore uses a unique alias
  # (ordi-db, ordi-minio) that exists only on this stack's own network.
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      default:
        aliases: [ordi-db]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ordi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ordi}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ordi}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Bundled object storage for installs without external S3/R2.
  # Off by default: enable with COMPOSE_PROFILES=minio in the environment,
  # plus S3_ENDPOINT=http://ordi-minio:9000. Root credentials are the same pair
  # the api uses, so the two can never drift apart. Nothing is published to
  # the host: all file traffic goes through the api.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    profiles: ["minio"]
    command: server /data
    networks:
      default:
        aliases: [ordi-minio]
    environment:
      # Interpolation runs even for profile-disabled services, so these cannot
      # be `:?`-required; MinIO itself refuses to start on empty credentials.
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Creates the bucket on first boot, so "make a bucket in the console" stops
  # being a manual step (the console is not even exposed).
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    profiles: ["minio"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://ordi-minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${BUCKET}
      "
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-}
      BUCKET: ${S3_BUCKET:-ordi}

  # The whole application: REST API, workers, and the built web app – the
  # image every release publishes (.github/workflows/image.yml), so a deploy
  # never builds anything. ORDI_VERSION pins a release (1.33.1) and is how
  # you roll back; unset, it follows `latest`. Pulled on every `up`, so a
  # redeploy from the panel ships the tag's current image instead of whatever
  # `latest` the host cached last month. To build from a checkout instead
  # (a fork, a Dockerfile change), add docker-compose.build.yml.
  api:
    image: ghcr.io/romirom11/ordi:${ORDI_VERSION:-latest}
    pull_policy: always
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      default:
        # The agent-worker reaches the api by this name, for the same reason
        # the database is ordi-db: on a shared PaaS network a generic `api`
        # can resolve to another project's container.
        aliases: [ordi-api]
    healthcheck:
      # /healthz answers once migrations have run and the server listens; the
      # agent-worker waits for it instead of logging "API unreachable" while
      # the api boots. Docker does not restart an unhealthy container, so a
      # slow migration only delays the worker, it never kills the api.
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s
    environment:
      NODE_ENV: production
      # Migrations run on boot (see the image's CMD), so a fresh volume and an
      # upgraded image both end up at the right schema without extra steps.
      DATABASE_URL: postgres://${POSTGRES_USER:-ordi}:${POSTGRES_PASSWORD}@ordi-db:5432/${POSTGRES_DB:-ordi}
      APP_URL: ${APP_URL:?set APP_URL to the public https address}
      # Same origin as the SPA: the API lives under /api/v1 on it, and every
      # callback URL is built by appending that path – so no /api suffix here.
      API_URL: ${API_URL:-${APP_URL}}
      CORS_ORIGINS: ${CORS_ORIGINS:-${APP_URL}}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY (32-byte hex)}
      SMTP_URL: ${SMTP_URL:-}
      SMTP_FROM: ${SMTP_FROM:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-ordi}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-auto}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      # AI agent employees: runs execute in the agent-worker container below,
      # never here. The api's own in-process worker stays off; the secret
      # opens /api/v1/agent-worker/* to the worker container. To run
      # everything in this one container instead (not recommended: the
      # process that executes model-authored code then sits next to every
      # secret above), set AGENT_WORKER_ENABLED=1, mount agent_work here as
      # the worker does, and start with --scale agent-worker=0.
      AGENT_WORKER_ENABLED: ${AGENT_WORKER_ENABLED:-0}
      AGENT_WORKER_CONCURRENCY: ${AGENT_WORKER_CONCURRENCY:-2}
      AGENT_WORKER_SECRET: ${AGENT_WORKER_SECRET:?set AGENT_WORKER_SECRET (any random string, shared with agent-worker)}
      # Claude is connected in Settings → Agents (a `claude setup-token`
      # subscription token or an API key). This env var is only a fallback
      # source for API keys, for a PaaS that configures everything by env.
      # It stays on the api: the worker receives the credential per run.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

  # ── Agent runs: their own container ──
  #
  # An agent run is the only thing in ordi that executes model-authored code.
  # It is sandboxed (rebuilt child env, per-run token, allow/deny tool lists –
  # see docs/architecture-decisions.md §12), but the blast radius of an escape
  # is still the container it runs in – and the api container holds
  # everything. So runs execute here, in a container that has no database:
  # it talks to the api over HTTP with one shared secret and holds only what
  # the run in front of it needs – the model credential, the repository token
  # and the run's own revocable API token. It owns the volume for checkouts
  # and transcripts, and can get its own CPU/memory limits and network policy.
  #
  # Runs are claimed with SKIP LOCKED on the api side, so nothing executes
  # twice even with AGENT_WORKER_ENABLED=1 on the api by mistake. Without a
  # Claude credential (Settings → Agents) the worker just idles.
  agent-worker:
    image: ghcr.io/romirom11/ordi:${ORDI_VERSION:-latest}
    pull_policy: always
    restart: unless-stopped
    command: ["sh", "-c", "pnpm --filter @ordi/api exec tsx src/agent-worker.ts"]
    environment:
      NODE_ENV: production
      ORDI_API_URL: http://ordi-api:3000
      AGENT_WORKER_SECRET: ${AGENT_WORKER_SECRET:?set AGENT_WORKER_SECRET (any random string, shared with api)}
      AGENT_WORKER_CONCURRENCY: ${AGENT_WORKER_CONCURRENCY:-2}
    volumes:
      # tasks/<taskId>/checkout: one fresh clone per run, deleted when it
      # ends – size for AGENT_WORKER_CONCURRENCY × repository size; and
      # tasks/<taskId>/harness: session transcripts kept 30 days so follow-ups
      # resume. Every container that runs agents must mount the same volume
      # (docs/operations.md).
      - agent_work:/data/agent-work
    depends_on:
      api:
        condition: service_healthy

volumes:
  db_data:
  minio_data:
  agent_work:
