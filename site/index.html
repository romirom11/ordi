<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ordi – the operations system for small agencies and product teams</title>
    <meta
      name="description"
      content="ordi has moved to ordi.one: projects, CRM, knowledge base, time, finance and people in one self-hosted app."
    />

    <!--
      This page used to be a second copy of the landing page. It is now a
      redirect, because two sites saying the same thing means one of them is
      out of date - and it was this one. ordi.one is the site; this address
      stays alive for the links that already point at it.

      The canonical tag hands the ranking to ordi.one, the refresh moves a
      browser with no JavaScript, and the script below preserves whatever
      path or anchor someone arrived with.
    -->
    <link rel="canonical" href="https://ordi.one/" />
    <meta http-equiv="refresh" content="0; url=https://ordi.one/" />

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23283b6b'/%3E%3Ccircle cx='16' cy='16' r='7.5' fill='none' stroke='white' stroke-width='4.2'/%3E%3C/svg%3E"
    />

    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: hsl(228 8% 6%);
        color: hsl(220 14% 93%);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        line-height: 1.6;
        text-align: center;
      }
      main {
        max-width: 34rem;
      }
      svg {
        width: 48px;
        height: 48px;
        margin-inline: auto;
      }
      h1 {
        margin: 1.25rem 0 0;
        font-size: 1.5rem;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0.75rem 0 0;
        color: hsl(220 7% 62%);
      }
      a.go {
        display: inline-block;
        margin-top: 1.5rem;
        padding: 0.7rem 1.25rem;
        border-radius: 10px;
        background: hsl(235 65% 65%);
        color: hsl(228 30% 8%);
        font-weight: 600;
        text-decoration: none;
      }
      a.alt {
        color: hsl(235 70% 78%);
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="7" fill="#283b6b" />
        <circle cx="16" cy="16" r="7.5" fill="none" stroke="#fff" stroke-width="4.2" />
      </svg>

      <h1>ordi lives at ordi.one</h1>
      <p>
        The site moved so there is one place to keep current: features, pricing, desktop
        downloads and the changelog are all there.
      </p>

      <a class="go" href="https://ordi.one/">Go to ordi.one</a>

      <p>
        Or straight to the
        <a class="alt" href="https://github.com/romirom11/ordi">repository</a>.
      </p>
    </main>

    <script>
      // Keep the path and anchor someone arrived with: /ordi/#features should
      // land on ordi.one/#features, not on the front page.
      (function () {
        var path = location.pathname.replace(/^\/ordi\/?/, '/');
        location.replace('https://ordi.one' + path + location.search + location.hash);
      })();
    </script>
  </body>
</html>
