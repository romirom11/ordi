[package]
name = "ordi-desktop"
version = "1.36.1"
description = "ordi desktop"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-deep-link = "2"
# Deep links only reach an ALREADY RUNNING app if a second launch hands its
# argv over – without this, ordi://auth starts a fresh instance on Windows and
# Linux and the sign-in never completes.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Native webview handles for the trackpad back / forward swipe (see
# enable_swipe_navigation in main.rs). Same versions Tauri already builds.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "objc2-app-kit", "WKWebView"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2", features = ["v2_24"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
